name: Build Box64 Winlator

on:
  workflow_dispatch:

jobs:
  build-winlator:
    name: Box64 Winlator ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake ninja-build git wget unzip \
            build-essential dpkg-dev

      - name: Clone Box64
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64.git box64-src

      - name: Build Winlator
        run: |
          cmake -S box64-src -B build \
            -G Ninja \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DWINLATOR=ON \
            -DBOX32=OFF \
            -DNOGIT=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build -j2

      - name: Check Box64
        run: |
          file build/box64
          ls -lh build/box64

      - name: Package
        run: |
          mkdir -p package/data/data/com.termux/files/usr/bin
          cp build/box64 package/data/data/com.termux/files/usr/bin/box64

          mkdir -p package/DEBIAN

          cat > package/DEBIAN/control <<'EOF'
          Package: box64-winlator
          Version: 0.4.3
          Architecture: aarch64
          Maintainer: yuuta
          Description: Box64 for Winlator ARM64
          EOF

          dpkg-deb --build package box64-winlator_0.4.3_aarch64.deb

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: box64-winlator-aarch64
          path: box64-winlator_0.4.3_aarch64.deb
