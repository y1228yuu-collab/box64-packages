name: Build Box64 Packages

on:
  workflow_dispatch:

jobs:
  arm64:
    name: Box64 ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake ninja-build git wget unzip \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Clone Box64
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64.git box64-src

      - name: Build ARM64
        run: |
          cmake -S box64-src -B build-arm64 \
            -G Ninja \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DTERMUX=ON \
            -DBOX32=OFF \
            -DNOGIT=ON \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-arm64 -j2

      - name: Check ARM64
        run: |
          file build-arm64/box64

      - name: Package ARM64
        run: |
          rm -rf package-arm64
          mkdir -p package-arm64/DEBIAN
          mkdir -p package-arm64/data/data/com.termux/files/usr/bin

          cp build-arm64/box64 \
            package-arm64/data/data/com.termux/files/usr/bin/box64

          cat > package-arm64/DEBIAN/control <<'CONTROL'
          Package: box64
          Version: 0.4.3
          Architecture: aarch64
          Maintainer: yuuta
          Description: Box64 x86_64 emulator for ARM64 Termux
          CONTROL

          chmod 755 package-arm64/DEBIAN
          chmod 755 package-arm64/data/data/com.termux/files/usr/bin/box64

          dpkg-deb --build package-arm64 box64_0.4.3_aarch64.deb

      - name: Upload ARM64
        uses: actions/upload-artifact@v4
        with:
          name: box64-aarch64
          path: box64_0.4.3_aarch64.deb
