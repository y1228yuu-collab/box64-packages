name: Build Box64 + Winlator APK

on:
  workflow_dispatch:

jobs:
  build-winlator:
    name: Box64 Winlator ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git wget unzip

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Clone Box64
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64.git box64-src

      - name: Build Winlator Box64
        run: |
          export PATH="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cmake -S box64-src -B build -G Ninja \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DANDROID=ON \
            -DWINLATOR_GLIBC=ON \
            -DBOX32=OFF \
            -DNOGIT=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j8

      - name: Check Box64
        run: |
          file build/box64
          ls -lh build/box64

      - name: Upload Box64
        uses: actions/upload-artifact@v4
        with:
          name: box64-winlator-arm64
          path: build/box64

  build-winlator-apk:
    name: Build Winlator APK
    runs-on: ubuntu-latest
    needs: build-winlator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Box64
        uses: actions/download-artifact@v4
        with:
          name: box64-winlator-arm64
          path: custom-box64

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Winlator
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/brunodev85/winlator.git winlator

      - name: Configure ARM64 only
        run: |
          cd winlator/app

          echo "=== ABI references ==="
          grep -RniE "armeabi-v7a|abiFilters|abiVersions" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle || true

          echo "=== Force ARM64 in Gradle ==="
          cat >> app/build.gradle <<'EOF'

android {
    defaultConfig {
        ndk {
            abiFilters "arm64-v8a"
        }
    }
}
EOF

          echo "=== Verify ==="
          tail -20 app/build.gradle

      - name: Build Winlator APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=4 \
            --stacktrace

      - name: Find APK
        run: |
          find winlator/app -type f -name "*.apk" -print

      - name: Upload Winlator APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-apk
          path: |
            winlator/app/**/build/outputs/apk/**/*.apk
